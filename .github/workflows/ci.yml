name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code: the token it gets can't push, open issues or change settings.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # End-to-end smoke tests: the built app in demo mode, in the runner's Chrome, under the real
      # security headers.
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
